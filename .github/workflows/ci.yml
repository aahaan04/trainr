name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Section 15 requires every text-on-surface pairing to clear WCAG AA 4.5:1.
      # Broken out as its own step so an accessibility regression is legible in the
      # job list rather than buried in the full suite. Three of the spec's original
      # token values were hand-calculated and measured below AA; this is what stops
      # them drifting back.
      - name: Accessibility contrast check
        run: npm run test:contrast

      - name: Unit and regression tests
        run: npm test

      - name: Production build
        run: npm run build
